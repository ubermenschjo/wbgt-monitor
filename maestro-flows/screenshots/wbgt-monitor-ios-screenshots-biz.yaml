appId: com.stagen.wbgt.biz
name: "WBGT Monitor iOS biz screenshots"
tags:
  - ios
  - screenshots
---
# Relaunch app to start from a known state
- stopApp
- launchApp:
    clearState: false
    permissions:
      notifications: allow
      location: allow
- runScript: "../../scripts/sleep.js"

# Allow notification permission
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Skip onboarding if visible
- tapOn:
    text: "スキップ"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Screenshot 1: Home screen (ホーム) — WBGT gauge, current location, hourly forecast
- assertVisible: "熱中症"
- waitForAnimationToEnd
- takeScreenshot:
    path: "./fastlane/screenshots/biz/ja-JP/iPhone6.5-01-Home.png"

# Screenshot 2: Record screen (作業記録) — Record list (FlatList)
- tapOn: "作業記録"
- waitForAnimationToEnd
- takeScreenshot:
    path: "./fastlane/screenshots/biz/ja-JP/iPhone6.5-02-Record.png"

# Screenshot 3: Export screen (書き出し) — CSV/PDF export (biz only)
- tapOn: "書き出し"
- waitForAnimationToEnd
- takeScreenshot:
    path: "./fastlane/screenshots/biz/ja-JP/iPhone6.5-03-Export.png"

# Screenshot 4: Settings screen (設定) — Notifications, WBGT threshold, edition select
- tapOn: "設定"
- waitForAnimationToEnd
- takeScreenshot:
    path: "./fastlane/screenshots/biz/ja-JP/iPhone6.5-04-Settings.png"
