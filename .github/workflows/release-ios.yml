# WBGT Monitor iOS Release — 手動実行
# biz / consumer のデュアルフレーバー対応
#
# eas submit        → IPA を TestFlight にアップロード（バイナリのみ）
# eas metadata:push → 説明文・キーワード・スクリーンショットを ASC に反映
#
# 必要な GitHub Secrets:
#   EXPO_TOKEN              - EAS access token
#   APPLE_API_KEY           - App Store Connect API key (.p8 全文)
#   ASC_APP_ID_BIZ          - biz 版 App Store Connect Apple ID (数値)
#   ASC_APP_ID_CONSUMER     - consumer 版 App Store Connect Apple ID (数値)

name: Release iOS

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App flavor'
        required: true
        default: 'biz'
        type: choice
        options:
          - biz
          - consumer
      profile:
        description: 'EAS Build profile'
        required: true
        default: 'production-biz'
        type: choice
        options:
          - production-biz
          - production-consumer
          - preview-biz
          - preview-consumer
      submit_target:
        description: 'Submit target'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore
      submit_metadata:
        description: 'Push store listing (EAS Metadata)'
        required: true
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@10.9.2

      - name: Install npm dependencies
        run: npm ci

      - name: Validate flavor and profile
        run: |
          FLAVOR="${{ inputs.flavor }}"
          PROFILE="${{ inputs.profile }}"
          if [[ "$PROFILE" != *"$FLAVOR"* ]]; then
            echo "Profile '$PROFILE' does not match flavor '$FLAVOR'" >&2
            exit 1
          fi

      - name: Setup App Store Connect API key
        run: |
          mkdir -p secrets
          printf '%s' "$APPLE_API_KEY" > secrets/appstore-api-key.p8
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - name: EAS Build (iOS)
        run: |
          npx eas build \
            --platform ios \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --message "Manual iOS release (${{ inputs.flavor }})"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_FLAVOR: ${{ inputs.flavor }}
          EXPO_ASC_API_KEY_PATH: secrets/appstore-api-key.p8
          EXPO_ASC_KEY_ID: 9PH58Q27M8
          EXPO_ASC_ISSUER_ID: dd2deef7-a1c0-4ffe-a765-e10021db3edd
          EXPO_APPLE_TEAM_ID: V8R9XYRK99
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
          EAS_BUILD_NO_EXPO_GO_WARNING: true

      - name: Resolve EAS Submit profile
        id: submit
        run: |
          FLAVOR="${{ inputs.flavor }}"
          TARGET="${{ inputs.submit_target }}"
          if [ "$TARGET" = "testflight" ]; then
            PROFILE="testflight-ios-${FLAVOR}"
          else
            PROFILE="production-ios-${FLAVOR}"
          fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "EAS Submit profile: $PROFILE (flavor=$FLAVOR, target=$TARGET)"

      - name: EAS Submit (App Store Connect)
        run: |
          npx eas submit \
            --platform ios \
            --profile ${{ steps.submit.outputs.profile }} \
            --non-interactive \
            --latest
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_FLAVOR: ${{ inputs.flavor }}
          EXPO_ASC_API_KEY_PATH: secrets/appstore-api-key.p8
          EXPO_ASC_KEY_ID: 9PH58Q27M8
          EXPO_ASC_ISSUER_ID: dd2deef7-a1c0-4ffe-a765-e10021db3edd
          ASC_APP_ID_BIZ: ${{ secrets.ASC_APP_ID_BIZ }}
          ASC_APP_ID_CONSUMER: ${{ secrets.ASC_APP_ID_CONSUMER }}

      - name: Push store listing (EAS Metadata)
        if: ${{ inputs.submit_metadata }}
        run: |
          npx eas metadata:push \
            --profile ${{ steps.submit.outputs.profile }} \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_FLAVOR: ${{ inputs.flavor }}
          EXPO_ASC_API_KEY_PATH: secrets/appstore-api-key.p8
          EXPO_ASC_KEY_ID: 9PH58Q27M8
          EXPO_ASC_ISSUER_ID: dd2deef7-a1c0-4ffe-a765-e10021db3edd
